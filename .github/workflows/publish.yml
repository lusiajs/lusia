name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run typecheck && bun run test

      - name: Check the tag matches the version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Generate the docs
        run: bun run docs:generate

      - name: Publish
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=beta ;; esac
          bun publish --access public --tag "$TAG"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Keep latest on the newest beta while no stable version exists
        run: |
          NAME=$(bun -p "require('./package.json').name")
          VERSION=$(bun -p "require('./package.json').version")
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          LATEST=$(npm view "$NAME" dist-tags.latest)
          case "$LATEST" in
            ""|0.0.0*|*-*) npm dist-tag add "$NAME@$VERSION" latest ;;
          esac
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @lusiajs/language-tools with the same version
        run: |
          bun scripts/build-editor.ts
          ROOT_VERSION=$(bun -p "require('./package.json').version")
          TOOLS_VERSION=$(bun -p "require('./packages/language-tools/package.json').version")
          test "$TOOLS_VERSION" = "$ROOT_VERSION"
          NAME=$(bun -p "require('./packages/language-tools/package.json').name")
          TAG=latest
          case "$TOOLS_VERSION" in *-*) TAG=beta ;; esac
          cd packages/language-tools
          bun publish --access public --tag "$TAG"
          cd "$GITHUB_WORKSPACE"
          LATEST=$(npm view "$NAME" dist-tags.latest)
          case "$LATEST" in
            ""|0.0.0*|*-*) npm dist-tag add "$NAME@$TOOLS_VERSION" latest ;;
          esac
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          case "$VERSION" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --generate-notes ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
