name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run typecheck && bun run test

      - name: Check the tag matches the version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Build the editor packages
        run: bun scripts/build-editor.ts && bun scripts/build-prettier-plugin.ts

      - name: Publish to npm
        run: |
          scripts/publish-package.sh .
          scripts/publish-package.sh packages/language-tools
          scripts/publish-package.sh packages/prettier-plugin
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          case "$VERSION" in
            *-*) gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --generate-notes ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
