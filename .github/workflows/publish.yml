name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run typecheck && bun run test

      - name: Check the tag matches the version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Publish
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=beta ;; esac
          bun publish --access public --tag "$TAG"
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set latest while only betas exist
        run: |
          NAME=$(bun -p "require('./package.json').name")
          VERSION=$(bun -p "require('./package.json').version")
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          LATEST=$(npm view "$NAME" dist-tags.latest)
          if [ -z "$LATEST" ]; then npm dist-tag add "$NAME@$VERSION" latest; fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
